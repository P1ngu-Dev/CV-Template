# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Python 3.12+ (stdlib para el CLI), YAML (RenderCV 2.8), Typst
  Artefacto principal: main/cv.yaml (CV maestro, tema moderncv, locale spanish)
  Arquitectura: CLI único (scripts/cv.py) + cvlib.py compartido + servidor MCP
  Datos: un CV por postulación en applications/<YYYY-MM-empresa-rol>/cv.yaml
  Testing: python3 scripts/cv.py check (validación de esquema RenderCV)
  Skills: 22 skills de CV en .agents/skills/ (21 vendorizadas + cv-workspace local)
  Agentes: AGENTS.md como fuente única; puentes para Claude, Cursor, Copilot,
  Gemini, Codex y OpenCode; servidor MCP en mcp/cv_workspace_server.py
  Conventions: RenderCV YAML schema; main/cv.yaml como fuente de verdad;
  outputs/ generado y no versionado

rules:
  proposal:
    - Acotar el cambio a secciones específicas del CV o a un archivo del CLI
    - Incluir verificación de compatibilidad con los CVs existentes
  specs:
    - Usar Given/When/Then cuando cambie el comportamiento del CLI o del MCP
    - Usar palabras RFC 2119 (MUST, SHALL, SHOULD, MAY)
  design:
    - Documentar decisiones de tema y layout con su justificación
    - Señalar efectos en outputs renderizados y en la portabilidad
  tasks:
    - Agrupar por fases con numeración jerárquica
    - Mantener tareas completables en una sesión
  apply:
    - Reutilizar scripts/cvlib.py; no duplicar lógica entre CLI y MCP
    - Validar YAML antes de renderizar
  verify:
    test_command: "python3 scripts/cv.py check 2>&1"
    build_command: "python3 scripts/cv.py render main 2>&1"
    coverage_threshold: 0
  archive:
    - Advertir antes de fusionar cambios destructivos en el CV maestro

testing:
  strict_tdd: false
  rationale: "El proyecto es un CV en YAML; la validación de RenderCV es la puerta de calidad. El CLI sí tiene smoke tests en CI (doctor, check, skills y MCP)."
  runner:
    framework: "scripts/cv.py"
    command: "python3 scripts/cv.py check"
    available: true
    note: "No hay pytest; la verificación es de esquema y render."
  layers:
    unit: false
    integration: true
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: true
      command: "ruff check scripts mcp"
    type_checker:
      available: false
      command: ""
    formatter:
      available: false
      command: ""
  render_validation:
    command: "python3 scripts/cv.py check --pdf"
    description: "Valida el esquema YAML y compila el PDF con Typst"
