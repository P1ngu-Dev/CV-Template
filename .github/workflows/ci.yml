name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: pip install "ruff>=0.6"
      - name: Lint
        run: ruff check scripts mcp

  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: python -m pip install -e .

      - name: Diagnóstico del entorno
        run: python scripts/cv.py doctor

      - name: Validar CVs
        run: python scripts/cv.py check

      - name: Enlazar skills
        run: python scripts/cv.py sync-skills

      - name: Verificar enlaces de skills
        run: python scripts/cv.py sync-skills --check

      - name: Bootstrap idempotente (contrato JSON)
        shell: bash
        run: |
          python scripts/cv.py bootstrap --no-install --no-check --json > bootstrap.json
          python -c "import json; d=json.load(open('bootstrap.json')); assert d['ok'], d['next_actions']; assert any(s['step'] == 'rendercv' and s['ok'] for s in d['steps'])"

      - name: Compilar Python
        run: python -m compileall -q scripts mcp

      - name: Smoke test MCP
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | python mcp/cv_workspace_server.py > mcp-smoke.json
          python -c "import json; data=[json.loads(l) for l in open('mcp-smoke.json')]; assert data[0]['result']['serverInfo']['name']=='cv-workspace'; assert len(data[1]['result']['tools'])>=8"
