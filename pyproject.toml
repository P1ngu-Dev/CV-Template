[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-workspace"
version = "0.1.0"
description = "Workspace CV-as-code con RenderCV, validación reproducible y soporte para agentes de IA"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "rendercv[full]==2.8",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "archive", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
